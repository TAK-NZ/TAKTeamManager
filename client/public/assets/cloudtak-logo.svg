<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79.3 51.62">
<!--
  TAK-NZ's CloudTAK icon: the cloud+arrow mark traced from CloudTAK's own
  api/web/public/CloudTAKLogo.svg, rebuilt as this deployment's actual
  install icon (cdk/src/cloudtak-oidc-setup/CloudTAKLogo.png): solid
  black with a white outline, instead of that PNG's multi-color gradient
  fill, but as a real vector, crisp at any size.

  Two-layer construction, matching how the reference PNG is actually
  composited (confirmed by inspecting its pixels: the region behind the
  arrow notch is OPAQUE white, not a transparent hole):
    1. the outer cloud silhouette alone, filled solid white
    2. the same silhouette PLUS the inner arrow/flag cutout, filled
       black with fill-rule evenodd (the two subpaths together punch the
       arrow-shaped hole through the black layer) and a white stroke
       drawn BEHIND the fill (paint-order="stroke fill") for the outline

  Layer 1 is what stays visibly white through layer 2's cutout; without
  it that hole would show whatever is behind the icon instead of a
  deliberate white shape, which is wrong on any background but white.

  The viewBox is the original 74.3 x 46.62 path bounds padded by 2.5
  units on every side (matching the stroke-width) and the path content
  translated by that same amount. The original, unpadded viewBox
  touched the path on all four edges with zero margin, so an outline
  stroke (which extends past the fill boundary) was clipped by the
  viewBox itself on every side. This comment documents the fix for that.
-->
<g transform="translate(2.5,2.5)">
