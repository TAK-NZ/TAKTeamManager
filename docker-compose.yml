version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tak_team_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/client/node_modules
    command: sh -c "npm run dev"

  sync-worker:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: node server/workers/syncWorker.js
    restart: unless-stopped

volumes:
  postgres_data: