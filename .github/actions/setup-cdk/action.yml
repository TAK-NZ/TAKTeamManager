name: 'Setup CDK Environment'
description: 'Common setup steps for CDK workflows: Node.js, AWS credentials (OIDC), and npm install in cdk/'

inputs:
  aws-role-arn:
    description: 'AWS IAM role ARN to assume'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  role-session-name:
    description: 'AWS role session name'
    required: false
    default: 'GitHubActions'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: cdk/package-lock.json

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ${{ inputs.role-session-name }}

    # Unlike the sibling infra repos, this project's CDK app lives in cdk/, not
    # at the repo root -- so dependencies are installed there.
    - name: Install CDK dependencies
      shell: bash
      working-directory: cdk
      run: npm ci

    # The oidc-setup Lambda is bundled by NodejsFunction (esbuild) at synth
    # time and needs its own node_modules present so axios/form-data bundle
    # (see cdk/README.md). The secret-generator Lambda has no package.json --
    # it uses only the Node stdlib plus the AWS SDK esbuild leaves external --
    # so there is nothing to install for it.
    - name: Install Lambda dependencies
      shell: bash
      working-directory: cdk/src/oidc-setup
      run: npm ci
