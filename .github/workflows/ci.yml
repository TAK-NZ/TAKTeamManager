name: CI

# Runs on every push, every pull request, and on a weekly schedule (Requirement 20.2:
# "no more than 7 days" between scheduled runs) so that newly disclosed vulnerabilities
# in already-merged dependencies are still caught even without new code changes.
on:
  push:
  pull_request:
  schedule:
    # Every Sunday at 00:00 UTC - a 7-day interval, satisfying Req 20.2's "no more than
    # 7 days" recurrence requirement.
    - cron: '0 0 * * 0'

jobs:
  # ---------------------------------------------------------------------------
  # security-audit: Requirement 20.2, 20.3, 20.4
  #
  # Runs `npm ci` followed by `npm audit --audit-level=high` against both the root
  # (server) dependency tree and the `client/` dependency tree, via a matrix so each
  # tree gets its own isolated job run and its own pass/fail result.
  #
  # Exit-code note (Req 20.4 - "audit itself fails to complete" must also fail the
  # build, not just "audit completed and found something"):
  # This runs `scripts/ci-audit.js` rather than a bare `npm audit --audit-level=high`.
  # A bare invocation conflates two very different non-zero exits: a real high/critical
  # finding, AND npm's remote audit endpoint
  # (`https://registry.npmjs.org/-/npm/v1/security/audits/quick`) returning a transient
  # transport error (observed in CI: HTTP 400 and 503) that has nothing to do with the
  # dependency tree. The wrapper tells those apart via `npm audit --json`, whose
  # `metadata.vulnerabilities` object is present only when the audit actually completed:
  #   - completed + high/critical > 0  -> exit 1 (Req 20.3), printing the report.
  #   - completed + none               -> exit 0.
  #   - did NOT complete (transport error) -> retry with backoff; if it never completes
  #     after all attempts, exit 1 (Req 20.4).
  # So a genuine finding still fails immediately (never retried), and a genuinely
  # uncompletable audit still fails - an errored/incomplete scan is NEVER mistaken for a
  # pass. We deliberately do NOT add `continue-on-error: true` or `|| true` to this step,
  # for the same reason: only a real, completed, clean audit exits 0. The only behaviour
  # added over the bare command is riding out a transient endpoint blip instead of
  # turning it into a red build. See scripts/ci-audit.js for the full rationale.
  #
  # Exceptions record: as of this workflow's creation, no documented/reviewed exceptions
  # record exists anywhere in this repository (checked for "audit" / "exceptions" files
  # at the repo root and in `.kiro/specs/production-hardening/design.md`; design.md's
  # Dependency Hygiene section directs a straightforward `npm audit --audit-level=high`
  # with no exceptions-file mechanism called for). Per Requirement 20.3, `npm audit
  # --audit-level=high`'s own severity-threshold behavior is used directly: every
  # high/critical finding fails the build unless a documented exceptions record is
  # introduced in a future change, at which point this job would need updating to consult
  # it before failing.
  security-audit:
    name: Dependency Audit (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: root
            directory: .
          - tree: client
            directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm ci (${{ matrix.tree }})
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Dependency audit (high/critical, retried on transient endpoint errors) (${{ matrix.tree }})
        working-directory: ${{ matrix.directory }}
        # Fails the job on:
        #   - any high/critical severity finding (Req 20.3), printing the full JSON audit
        #     report so each failing advisory is visible in the log, or
        #   - the audit failing to COMPLETE after bounded retries, e.g. a persistent
        #     registry/network error (Req 20.4).
        # A transient endpoint error (HTTP 400/503 from npm's audit endpoint) is retried
        # rather than failing the build outright. See the job-level comment above and
        # scripts/ci-audit.js for why this preserves both requirements. `working-directory`
        # sets the cwd, which ci-audit.js audits by default.
        run: node ${{ github.workspace }}/scripts/ci-audit.js

  # ---------------------------------------------------------------------------
  # test: Requirement 12.6
  #
  # Kept as a separate job from security-audit. The coverage gate itself (60% statement
  # coverage, treating exactly 60% as passing) is configured via the "jest" ->
  # "coverageThreshold" -> "global" -> "statements" key in the root package.json; the
  # `--coverage` flag below is what makes Jest actually compute coverage and enforce
  # that threshold. Jest fails (non-zero exit) both when a test fails and when coverage
  # is below the configured threshold, satisfying both halves of Req 12.6 with a single
  # step.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm ci (root)
        run: npm ci

      - name: Check pinned dependency versions (Req 20.5/20.6)
        # Fails the build if jsonwebtoken, bcryptjs, helmet, or express-rate-limit are
        # declared in package.json with a "^"/"~" range instead of an exact version.
        run: npm run lint:pinned-deps

      - name: npm test (root, with coverage gate)
        # Requirement 12.6: fail the build if any test fails, or if overall statement
        # coverage falls below 60% (exactly 60% is treated as passing). The 60%
        # `coverageThreshold` lives in package.json's "jest" key; passing `--coverage`
        # here is what makes Jest compute coverage and enforce that threshold - Jest
        # exits non-zero on its own when actual coverage is below any configured
        # threshold, so no extra scripting is needed here.
        run: npm test -- --coverage

  # ---------------------------------------------------------------------------
  # client-test: Requirements 2.7, 2.8
  #
  # Runs the client's Vitest suite (currently `src/services/api.test.js`, covering
  # the base-URL validation success/failure paths). Kept as its own job, separate
  # from `test` (root/Jest) and `security-audit`, since it exercises a different
  # runner against a different dependency tree.
  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm ci (client)
        working-directory: client
        run: npm ci

      - name: npm run lint (client)
        working-directory: client
        run: npm run lint

      - name: npm test (client)
        working-directory: client
        run: npm test
